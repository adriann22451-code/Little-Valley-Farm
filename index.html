<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Little Valley Farm</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#f3ead8;--fg:#2b2a24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--fg:#efe6d2}}
:root[data-theme="dark"]{--bg:#16140f;--fg:#efe6d2}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;display:flex;flex-direction:column}#gv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#ctl{display:none;position:relative;height:176px;flex:none}@media (pointer:coarse){#ctl{display:block}}
canvas{image-rendering:pixelated;background:#000}
.pad{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,0px));display:none;gap:6px}
#dp{left:14px;grid-template:repeat(3,46px)/repeat(3,46px)}#bt{right:16px;gap:14px;align-items:flex-end}
.pad button{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(20,16,10,.45);color:#fff;font:700 15px system-ui;touch-action:none}
#bt button{width:60px;height:60px}
@media (pointer:coarse){.pad{display:grid}#bt{display:flex}}
#rot{display:none;position:absolute;inset:0;background:var(--bg);align-items:center;justify-content:center;text-align:center;z-index:9;font-size:18px;padding:24px}
#rot{display:none!important}
[hidden]{display:none!important}
#wrap.np .pad{display:none!important}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vh,14px);text-align:center;padding:12px;color:#f4e3b0;font-family:Georgia,serif}
#ld{background:linear-gradient(#9fd07a,#5f9a45);color:#2d3b1a}
#mn{background:rgba(20,16,10,.66)}
.ttl{font:700 clamp(22px,8vh,46px) Georgia,serif;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.bar{width:min(60vw,320px);height:14px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden;border:2px solid rgba(0,0,0,.35)}
.bar i{display:block;height:100%;width:0;background:#f4d35e;transition:width .25s}
#tip,#ms{font:14px system-ui,sans-serif;max-width:min(80vw,460px);min-height:1.3em}
#mb{display:flex;flex-direction:column;gap:8px}
#mb button{font:700 clamp(14px,4.5vh,18px) system-ui,sans-serif;padding:clamp(6px,1.6vh,11px) 24px;min-width:210px;border-radius:12px;border:2px solid #d8b66a;background:#3b2a1a;color:#f4e3b0}
#mb button:hover:not(:disabled){background:#5a3f24}#mb button:disabled{opacity:.4}
#pz{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:10px;z-index:4;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,16,10,.5);color:#fff;font-size:15px}
#ib{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:56px;z-index:4;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,16,10,.5);color:#fff;font-size:15px}
#mb.g{display:grid;grid-template-columns:1fr 1fr}#mb.g button{min-width:0;font-size:clamp(12px,3.8vh,16px)}
#gv{position:absolute;inset:0;flex:none}#ctl{position:absolute;inset:0;height:auto;pointer-events:none;z-index:3}
.pad{pointer-events:none}#bt button,#js{pointer-events:auto}
#dp{left:max(18px,env(safe-area-inset-left,0px));bottom:max(26px,calc(env(safe-area-inset-bottom,0px) + 14px));display:none;transition:opacity .15s}
@media (pointer:coarse){#dp{display:block}}
#js{position:relative;width:124px;height:124px;border-radius:50%;background:rgba(20,16,10,.32);border:2px solid rgba(255,255,255,.5);touch-action:none}
#kn{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.75);pointer-events:none}
#bt{right:max(18px,env(safe-area-inset-right,0px));bottom:max(30px,calc(env(safe-area-inset-bottom,0px) + 18px))}
#mn{overflow-y:auto;justify-content:safe center}
#mb.iv{display:block;width:min(94vw,540px)}
#mb .ivw{background:linear-gradient(#4a3320,#33220f);border:3px solid #d8b66a;border-radius:12px;box-shadow:0 0 0 2px #1d130a,inset 0 0 0 2px #6e4a28;padding:8px;margin-bottom:8px;text-align:left}
#mb .ivt{display:flex;gap:4px;margin-bottom:8px}
#mb .ivt button{flex:1;min-width:0;padding:5px 0;font:700 13px system-ui;border-radius:8px 8px 0 0;border:2px solid #6e4a28;background:#241709;color:#a8946a}
#mb .ivt button.on{background:#5a3f24;color:#ffe9a8;border-color:#d8b66a}
#mb .ivg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
#mb .sl{position:relative;min-width:0;height:clamp(38px,11vh,62px);padding:0;border-radius:8px;border:2px solid #6e4a28;background:radial-gradient(#4a3320,#1d130a)}
#mb .sl.em{opacity:.4}
#mb .sl.on{border-color:#ffd86b;box-shadow:0 0 8px #ffd86b99}
#mb .sl.pk::after{content:'\1F331';position:absolute;left:2px;top:0;font-size:11px}
#mb .sl img{width:58%;image-rendering:pixelated}
#mb .sl span{font-size:clamp(16px,5vh,26px)}
#mb .sl b{position:absolute;right:3px;bottom:1px;font:700 11px monospace;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000}
#mb .ivd{margin-top:8px;padding:6px 10px;border-radius:8px;border:2px solid #6e4a28;background:#241709;font:13px system-ui;min-height:2.6em}
#mb .ivd small{opacity:.8}
#mb.pm{padding:14px 18px;background:linear-gradient(#4a3320,#33220f);border:3px solid #d8b66a;border-radius:12px;box-shadow:0 0 0 2px #1d130a,inset 0 0 0 2px #6e4a28}
#mb .sl i{position:absolute;left:3px;top:1px;font:700 9px monospace;color:#ffd86b;font-style:normal}
#mb .sl.nm{opacity:.55}
#mb .ivd button{margin-top:6px;min-width:0;padding:5px 16px;font-size:13px}
</style></head><body><div id="wrap"><div id="gv"><canvas id="c"></canvas></div><div id="ctl">
<div class="pad" id="dp"><div id="js"><b id="kn"></b></div></div>
<div class="pad" id="bt"><button id="bT">🔧</button><button id="bA">A</button></div></div>
<div class="ov" id="ld"><div class="ttl">🌾 Little Valley Farm</div><div class="bar"><i id="bf"></i></div><div id="tip">Memuat kebun nenek...</div><div style="font:11px system-ui;opacity:.75">Aset: SuperRetroWorld oleh Gif, Noiracide &amp; Romi</div></div>
<div class="ov" id="mn" hidden><div class="ttl" id="mt">Little Valley Farm</div><div id="ms"></div><div id="mb"></div></div>
<button id="pz" hidden>⏸</button><button id="ib" hidden>🎒</button>

 but to bring back to life together with the villagers.\""], ["Bawa hasil alam (sampai 6 buah) untuk dinilai: kayu, batu, jamur, madu, bijih...", "Bring natural goods (up to 6) to be judged: wood, stone, mushrooms, honey, ore..."], ["Festival Lampion hari ini! Semua permintaan warga memberi hadiah dua kali lipat.", "Lantern Festival today! All villager requests give double rewards."], ["Festival Panen hari ini! Jual hasil panenmu ke Pak Budi, harganya naik 1,5 kali.", "Harvest Festival today! Sell your crops to Pak Budi, prices are 1.5 times higher."], ["Tanahnya sudah lama kosong, tapi masih subur. Mulailah dengan cangkul dan benih.", "The land has been empty for a long time, but it's still fertile. Start with the hoe and seeds."], ["Cucuku sayang, kalau surat ini sampai, berarti kebun tuaku kini jadi milikmu.", "My dear grandchild, if this letter reaches you, my old farm is now yours."], ["Bab 2 selesai: Desa yang Kembali Ramai! Festival kini hadir di setiap musim.", "Chapter 2 complete: The Village Comes Alive Again! Festivals now happen every season."], ["Sudah lama aku ingin makan ikan bakar. Maukah kau memancing 2 ekor di kolam?", "I've wanted grilled fish for a long time. Would you catch 2 in the pond?"], ["\"Dulu desa ini ramai tiap musim panen. Orang-orang berkumpul di kebun ini.\"", "\"This village used to be lively every harvest season. People gathered in this garden.\""], ["Aku pernah membantunya menggali di sana, tapi ia melarangku melihat isinya.", "I once helped her dig there, but she wouldn't let me see what was inside."], ["Di bawah pohon oak ada kotak kecil berisi benih dan sebuah surat terakhir.", "Under the oak tree is a small box with seeds and a final letter."], ["Festival Ikan hari ini! Pak Budi membeli ikan dengan harga dua kali lipat.", "Fish Festival today! Pak Budi buys fish at double the price."], ["Hati-hati dekat kolam. Nenekmu menyimpan sesuatu di bawah pohon oak itu.", "Be careful near the pond. Your grandma kept something under that
