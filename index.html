<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Little Valley Farm</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#f3ead8;--fg:#2b2a24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--fg:#efe6d2}}
:root[data-theme="dark"]{--bg:#16140f;--fg:#efe6d2}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;display:flex;flex-direction:column}#gv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#ctl{display:none;position:relative;height:176px;flex:none}@media (pointer:coarse){#ctl{display:block}}
canvas{image-rendering:pixelated;background:#000}
.pad{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,0px));display:none;gap:6px}
#dp{left:14px;grid-template:repeat(3,46px)/repeat(3,46px)}#bt{right:16px;gap:14px;align-items:flex-end}
.pad button{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(20,16,10,.45);color:#fff;font:700 15px system-ui;touch-action:none}
#bt button{width:60px;height:60px}
@media (pointer:coarse){.pad{display:grid}#bt{display:flex}}
#rot{display:none;position:absolute;inset:0;background:var(--bg);align-items:center;justify-content:center;text-align:center;z-index:9;font-size:18px;padding:24px}
#rot{display:none!important}
[hidden]{display:none!important}
#wrap.np .pad{display:none!important}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vh,14px);text-align:center;padding:12px;color:#f4e3b0;font-family:Georgia,serif}
#ld{background:linear-gradient(#9fd07a,#5f9a45);color:#2d3b1a}
#mn{background:rgba(20,16,10,.66)}
.ttl{font:700 clamp(22px,8vh,46px) Georgia,serif;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.bar{width:min(60vw,320px);height:14px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden;border:2px solid rgba(0,0,0,.35)}
.bar i{display:block;height:100%;width:0;background:#f4d35e;transition:width .25s}
#tip,#ms{font:14px system-ui,sans-serif;max-width:min(80vw,460px);min-height:1.3em}
#mb{display:flex;flex-direction:column;gap:8px}
#mb button{font:700 clamp(14px,4.5vh,18px) system-ui,sans-serif;padding:clamp(6px,1.6vh,11px) 24px;min-width:210px;border-radius:12px;border:2px solid #d8b66a;background:#3b2a1a;color:#f4e3b0}
#mb button:hover:not(:disabled){background:#5a3f24}#mb button:disabled{opacity:.4}
#pz{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:10px;z-index:4;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,16,10,.5);color:#fff;font-size:15px}
#ib{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:56px;z-index:4;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,16,10,.5);color:#fff;font-size:15px}
#mb.g{display:grid;grid-template-columns:1fr 1fr}#mb.g button{min-width:0;font-size:clamp(12px,3.8vh,16px)}
</style></head><body><div id="wrap"><div id="gv"><canvas id="c"></canvas></div><div id="ctl">

<div class="pad" id="bt"><button id="bT">🔧</button><button id="bA">A</button></div></div>

let mode='load',lt=0,mk='';const INTRO=[L('Nenek','Cucuku sayang, kalau surat ini sampai, berarti kebun tuaku kini jadi milikmu.'),L('Nenek','Tanahnya sudah lama kosong, tapi masih subur. Mulailah dengan cangkul dan benih.'),L('Petunjuk','Gerak: panah/WASD atau D-pad. Aksi: A / Spasi. Ganti alat: 🔧 / Q. Inventori: 🎒 / I. Dekati warga lalu tekan A untuk bicara. Cangkul tanah, tanam benih, siram, lalu panen!')];
const $=id=>document.getElementById(id),wr=$('wrap'),KEY='lvf-save-2';
const hasSave=()=>{try{return !!localStorage.getItem(KEY)}catch(e){return false}};
function save(){try{localStorage.setItem(KEY,JSON.stringify({day,dayT,coins,harv,tool,x:P.x,y:P.y,soil,crop,s:inv.s,h:inv.h,sel}))}catch(e){}}
function reset(){soil.fill(0);crop.fill(null);day=1;dayT=0;coins=0;harv=0;tool=0;P.x=56;P.y=152;P.dx=0;P.dy=1;P.fx=1;dlg=[];inv.s=[6,6,0,0];inv.h=[0,0,0,0];sel=0;pend=0}
function play(){mode='play';$('mn').hidden=true;$('pz').hidden=false;$('ib').hidden=false;wr.classList.remove('np')}
function newGame(){reset();say(INTRO);play();save()}
function cont(){try{const s=JSON.parse(localStorage.getItem(KEY));reset();day=s.day;dayT=s.dayT;coins=s.coins;harv=s.harv;tool=s.tool;P.x=s.x;P.y=s.y;if(s.s){inv.s=s.s;inv.h=s.h;sel=s.sel||0}s.soil.forEach((v,i)=>soil[i]=v);s.crop.forEach((v,i)=>crop[i]=v);play()}catch(e){newGame()}}
function menu(kind){mode='menu';mk=kind;wr.classList.add('np');$('pz').hidden=true;$('ib').hidden=true;$('mn').hidden=false;const mb=$('mb'),ms=$('ms');mb.innerHTML='';mb.className=kind=='shop'||kind=='inv'?'g':'';
 const B=(x,f,d)=>{const b=document.createElement('button');b.textContent=x;b.disabled=!!d;b.onclick=f;mb.appendChild(b)};
 const ST=()=>`◎${coins} | Bibit ${CI.map((c,i)=>c+inv.s[i]).join(' ')} | Panen ${CI.map((c,i)=>c+inv.h[i]).join(' ')}`;
 $('mt').textContent=kind=='shop'?'Toko Pak Budi':kind=='inv'?'Inventori':'Little Valley Farm';
 if(kind=='pause'){ms.textContent='Jeda';B('▶ Lanjut',play);B('💾 Simpan',()=>{save();ms.textContent='Tersimpan ✓'});B('🏠 Menu Utama',()=>menu('main'))}
 else if(kind=='inv'){ms.textContent='Pilih bibit yang akan ditanam · '+ST();CI.forEach((c,i)=>B(`${c} ${CN[i]} · bibit ${inv.s[i]} · panen ${inv.h[i]}${sel==i?' ✓':''}`,()=>{sel=i;menu('inv')}));B('Tutup',play)}
 else if(kind=='shop'){ms.textContent=ST();CI.forEach((c,i)=>B(`Beli ${c} ${CN[i]} ${BUY[i]}◎`,()=>{if(coins>=BUY[i]){coins-=BUY[i];inv.s[i]++;save()}menu('shop')},coins<BUY[i]));const tot=inv.h.reduce((a,h,i)=>a+h*SELL[i],0);B(`Jual semua panen (+${tot}◎)`,()=>{coins+=tot;inv.h=[0,0,0,0];save();menu('shop')},!tot);B('Tutup',play)}
 else{ms.textContent='Kebun Peninggalan Nenek';B('▶ Mulai Baru',newGame);B('⏵ Lanjutkan',cont,!hasSave());B('? Cara Bermain',()=>{ms.textContent='Gerak: panah/WASD atau D-pad · Aksi: A/Spasi · Alat: 🔧/Q · Inventori: 🎒/I · Bicara dengan warga: A · Esc: jeda'})}}

{n:'Bu Sari',x:190,y:446,c:'#e05a8a',o:1,L:['Kamu cucu Nenek, ya? Dulu beliau sering membagi sayur ke seluruh desa.','Dulu festival panen diadakan di kebun ini tiap musim. Meriah sekali!','Kalau kebunmu makin hidup, warga pasti mau berkumpul lagi.']},
{n:'Kakek Joko',x:262,y:96,c:'#9aa0a6',o:2,L:['Hati-hati dekat kolam. Nenekmu menyimpan sesuatu di bawah pohon oak itu.','Aku pernah membantunya menggali di sana, tapi ia melarangku melihat isinya.','Kurasa sudah waktunya kamu menemukannya sendiri...']}];

function toast(m){toastM=m;toastT=performance.now()+2200}

function tint(col){const c=document.createElement('canvas');c.width=192;c.height=72;const x=c.getContext('2d');x.drawImage(im.player,0,0);x.globalCompositeOperation='source-atop';x.globalAlpha=.4;x.fillStyle=col;x.fillRect(0,0,192,72);return c}

 (function f(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;update(dt);draw();requestAnimationFrame(f)})(0)}
